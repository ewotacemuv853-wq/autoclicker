name: Build Debug APK

on:
  workflow_dispatch:        # 允许在 Actions 页面手动触发
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses & install SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.2
          arguments: clean assembleDebug

      - name: Verify APK contains app code
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "校验 APK: $APK  大小: $(stat -c%s "$APK") 字节"
          if [ "$(stat -c%s "$APK")" -lt 100000 ]; then
            echo "::error::APK 过小 (<100KB)，疑似空壳构建，终止。"
            exit 1
          fi
          python3 - "$APK" <<'PY'
          import zipfile, sys
          apk = sys.argv[1]
          with zipfile.ZipFile(apk) as z:
              dex = z.read('classes.dex')
          needed = [b'AutoClickService', b'MainActivity', b'dispatchGesture',
                    b'ClickPoint', b'Prefs', b'Scheme']
          missing = [n.decode() for n in needed if n not in dex]
          if missing:
              print("::error::以下核心类未编译进 APK:", missing)
              sys.exit(1)
          print("OK: 全部核心类已编入 APK，classes.dex 大小", len(dex), "字节")
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
