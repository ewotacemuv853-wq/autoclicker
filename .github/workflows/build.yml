name: Build Debug APK

on:
  workflow_dispatch:        # 允许在 Actions 页面手动触发
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses & install SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.2
          arguments: clean assembleDebug

      - name: Diagnostics - source tree & compiled classes
        if: always()
        run: |
          echo "=== 源码 .java 文件 ==="
          find app/src/main/java -name '*.java' | sort
          echo "=== 编译产物 .class (intermediates/javac) ==="
          find app/build/intermediates/javac -name '*.class' 2>/dev/null | sort | head -60 || echo "无 javac 产物"
          echo "=== app/build/outputs/apk/debug ==="
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "无 APK 输出"

      - name: Diagnostics - APK inventory
        if: always()
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then echo "未找到 APK"; exit 0; fi
          echo "APK=$APK size=$(wc -c < "$APK") bytes"
          echo "=== unzip -l (APK 内容) ==="
          unzip -l "$APK" | head -60
          echo "=== dex 中本项目类清单 ==="
          python3 - <<'PY'
          import zipfile, re, glob, os
          apk = glob.glob('app/build/outputs/apk/debug/*.apk')[0]
          with zipfile.ZipFile(apk) as z:
              dexes=[n for n in z.namelist() if re.match(r'classes[0-9]*\.dex$', n)]
              blob=b''.join(z.read(d) for d in dexes)
          print("dex files:", dexes, "| APK size:", os.path.getsize(apk))
          types=sorted(set(re.findall(rb'Lcom/example/autoclicker/[A-Za-z0-9_$]+;', blob)))
          print("本项目类数量:", len(types))
          for t in types: print("   ", t.decode())
          need=[b'AutoClickService',b'MainActivity',b'ClickPoint',b'Prefs',b'Scheme',b'dispatchGesture']
          miss=[n.decode() for n in need if n not in blob]
          print("缺失核心类:", miss if miss else "无 (全部存在)")
          PY

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
